name: Temblo packages

on:
  push:
    branches: [temblo]

permissions:
  contents: write

jobs:
  packages:
    name: Build and release the browser packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - uses: ./.github/actions/wasm-toolchain

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:packages

      - name: Pin workspace dependencies
        run: bun scripts/rewrite-workspace-deps.ts

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for dir in packages/*/; do
            if [ "$(jq -r '.private // false' "$dir/package.json")" = "true" ]; then continue; fi
            (cd "$dir" && bun pm pack --destination "$RUNNER_TEMP/packages" --quiet)
          done
          ls -l "$RUNNER_TEMP/packages"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="temblo-${GITHUB_SHA::12}"
          gh release create "$tag" "$RUNNER_TEMP"/packages/*.tgz \
            --target "$GITHUB_SHA" --title "$tag" --latest=false \
            --notes "Browser packages built from $GITHUB_SHA."
